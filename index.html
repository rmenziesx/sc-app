<style>

.rg{position:relative;flex:none}.rg svg{display:block}.rgt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#ov{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;max-height:82vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s ease}

<script>
"use strict";
/* ===== RULES (versioned, evidence-tagged; every constant lives in K) ===== */
const RV='1.2.1',REVIEWED='2026-10-05';
const R={
'SAF-001':{d:'Acute red-flag screening answers -> ESCALATE; exertional tests blocked',ev:'S1',src:'PAR-Q+ principle (not a diagnosis)'},
'SAF-002':{d:'Other screening flags -> MODIFY (exertion needs self-reported professional advice); illness -> STOP/postpone',ev:'S1',src:'PAR-Q+ principle'},
'SAF-003':{d:'Pain context (severity, worsening, altered movement) -> ALLOW/MODIFY/STOP/ESCALATE. No universal safe-pain number',ev:'S1',src:'Spec s.36'},
'E1R-001':{d:'Epley e1RM = load x (1 + reps/30); eligible 3-8 reps, technique not poor, effort RPE>=7',ev:'E2',src:'Epley 1985; estimate only'},
'E1R-002':{d:'Confidence downgraded by high reps, unfamiliarity, acceptable-only technique, RPE>=9.5, any pain',ev:'H1',src:'Engineering heuristic'},
'E1R-003':{d:'Next test load from Epley on reps+RIR toward 6 reps @RIR2; 2.5 kg steps; max 3 working attempts; increase capped +25%',ev:'H1',src:'Engineering heuristic'},
'TM-001':{d:'Training max = e1RM x 0.90/0.85/0.80 (HIGH/MED/LOW); x0.95 more if detrained. Initial loading only',ev:'H1',src:'Spec s.12; 0.95 is an assumption'},
'ASM-001':{d:'Draft/review assessments are editable (edits logged); finalised assessments are immutable and checksummed; corrections require a reassessment',ev:'H1',src:'Data-integrity design'},
'SAFETY-RPE-OVERRIDE':{d:'Warning symptom, safety-stop condition or pain-context STOP/ESCALATE stops the set and exercise. RPE is ignored. No reduced-load retry',ev:'S1',src:'Spec: working-set effort response (rules 1.1.0)',why:'RPE is subjective effort, not a safety signal; symptoms are never handled by adjusting load',rv:REVIEWED,since:'1.1.0'},
'EFFORT-TECHNIQUE-OVERRIDE':{d:'Major technique deterioration ends the exercise; minor ends the set and next load -5%. RPE cannot override technique',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Technique failure invalidates the set regardless of reported effort; 5% is a heuristic',rv:REVIEWED,since:'1.1.0'},
'EFFORT-REP-FAILURE':{d:'Failed repetition: set FAILED, no progression, next set -10%; a second failure ends the exercise',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'A failed rep is more significant than a rep short of range; 10% is a heuristic',rv:REVIEWED,since:'1.1.0'},
'EFFORT-BELOW-MIN-REPS':{d:'Reps below range: next load -10% if RPE>=9 else -5%; second below-range set ends the exercise',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Underperformance with high effort suggests load too heavy; magnitudes are heuristics',rv:REVIEWED,since:'1.1.0'},
'EFFORT-FIRST-RPE10':{d:'First set RPE>=10: next set -10%, no progression; a following set at RPE>=9 ends the exercise',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'First-set failure-level effort suggests load or readiness mismatch; 10% is a heuristic',rv:REVIEWED,since:'1.1.0'},
'EFFORT-FIRST-RPE9':{d:'First set RPE 9 (9 to <10): next set -5%, no progression',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'High first-set effort: small autoregulated reduction; 5% is a heuristic',rv:REVIEWED,since:'1.1.0'},
'EFFORT-LATER-RPE10':{d:'Later set RPE>=10: stop remaining sets for the exercise, hold progression',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Later-set failure-level effort points to accumulated fatigue/volume, not necessarily load',rv:REVIEWED,since:'1.1.0'},
'EFFORT-LATER-RPE9':{d:'Later set RPE 9: next set -5% (or finish if final set), no progression',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Accumulated set fatigue: small reduction; 5% is a heuristic',rv:REVIEWED,since:'1.1.0'},
'EFFORT-LOW-RPE':{d:'RPE <= target-2: load increases only with max reps, acceptable technique and no pain (+2.5% small / +5% large), otherwise maintain',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Avoids chasing subjective RPE noise; increments are heuristics',rv:REVIEWED,since:'1.1.0'},
'EFFORT-WITHIN-TARGET':{d:'No effort-rule trigger: maintain load; progression eligible only with reps met, technique acceptable, pain-free and RPE reported',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Default maintain; progression decided by the existing progression rule',rv:REVIEWED,since:'1.1.0'},
'EFFORT-INSUFFICIENT-DATA':{d:'Required inputs missing: no load change, no progression, nothing invented',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Engine never invents missing data',rv:REVIEWED,since:'1.1.0'},
'EFFORT-NEXT-SESSION':{d:'Next-session effects: hold after high-effort events; 2 consecutive first-set RPE>=9 sessions: -5% and BLOCKED with load review; 3: programme review',ev:'H1',src:'Spec: working-set effort response (rules 1.1.0)',why:'Repeated patterns, not single observations, change the programme',rv:REVIEWED,since:'1.1.0'},
'MOV-001':{d:'Movement screen: pain/altered movement flags the related strength test',ev:'H1',src:'Engineering heuristic'},
'CAR-001':{d:'10-min self-paced field test (no VO2max claim). Starting cardio 20-30 min by completion and RPE',ev:'H1',src:'Spec s.22/36 range 20-40 min'},
'RUN-001':{d:'Start stage R0/R1/R2 from walk tolerance, calf raise, balance, pain. Field screens are not validated predictors',ev:'U1',src:'Engineering heuristic'},
'REC-001':{d:'Independent recovery flags (sleep<6h, readiness<=4, stress>=8, soreness>=8); no combined score',ev:'H1',src:'Spec s.29'}};
const K={REP_MIN:3,REP_MAX:8,RPE_MIN:7,STEP:2.5,MAX_ATT:3,TARGET_REPS:6,TARGET_RIR:2,PAIN_SEVERE:7,TM:{HIGH:.9,MEDIUM:.85,LOW:.8},DETRAIN:.95,WARM:[[.4,8],[.6,5],[.8,3]],SLEEP_LOW:6,READY_LOW:4,STRESS_HIGH:8,SORE_HIGH:8,REASSESS_WEEKS:10,CARDIO_MIN:10,MAX_UP:1.25,LOAD_MAX:500,REPS_INPUT_MAX:50,AGE_MAX:120};
const Q=[['chest','Chest pain or pressure (at rest or with activity)','a'],['faint','Fainting, near-fainting or severe dizziness','a'],['breath','Unexplained severe breathlessness','a'],['neuro','New numbness, weakness, speech or vision problems','a'],['worse','An injury or pain that is getting worse','a'],['heart','A healthcare professional has said you have a heart or blood-pressure condition','f'],['meds','You take prescribed medication for heart, blood pressure or blood sugar','f'],['joint','A bone, joint or back problem that exercise could worsen','f'],['preg','Pregnant, or gave birth in the last 6 months','f'],['other','Any other reason you think you should not exercise','f'],['ill','Currently ill or feverish','s']];
/* ===== ENGINE (pure functions, no profile or storage access) ===== */
const rnd=x=>typeof x==='number'&&isFinite(x)?Math.max(K.STEP,Math.round(x/K.STEP)*K.STEP):null;
const Eng={
epley:(l,r)=>isN(l)&&isN(r)&&l>0&&r>=0?+(l*(1+r/30)).toFixed(1):null,
screen(a){if(!a||typeof a!=='object')return{g:'STOP',rule:'SAF-002',why:['No screening data']};const g=t=>Q.filter(q=>q[2]===t&&a[q[0]]).map(q=>q[1]);
 if(g('a').length)return{g:'ESCALATE',rule:'SAF-001',why:g('a')};
 if(g('s').length)return{g:'STOP',rule:'SAF-002',why:g('s')};
 return g('f').length?{g:'MODIFY',rule:'SAF-002',why:g('f')}:{g:'ALLOW',rule:'SAF-002',why:[]}},
pain(p){if(!p||!isN(p.pain)||p.pain<0||p.pain>10)return{g:'STOP',rule:'SAF-003',invalid:true};const o=p.pain>=K.PAIN_SEVERE?'ESCALATE':(p.worse||p.altered)?'STOP':p.pain>0?'MODIFY':'ALLOW';return{g:o,rule:'SAF-003'}},
valid:a=>a.reps>=K.REP_MIN&&a.reps<=K.REP_MAX&&a.rpe>=K.RPE_MIN&&a.tech!=='poor'&&!a.stopped,
conf(a,fam){if(!a||!isN(a.reps)||!isN(a.rpe)||a.reps<0||!['familiar','some','new'].includes(fam))return'LOW';let s=2;if(a.reps>6)s--;if(a.reps>8)s--;if(fam==='some')s--;if(fam==='new')s-=2;if(a.tech==='acceptable')s--;if(a.rpe>=9.5)s--;if(a.pain>0)s=0;return['LOW','MEDIUM','HIGH'][Math.max(0,s)]},
next(a){if(!a||!isN(a.load)||a.load<=0||!isN(a.reps)||a.reps<0||!isN(a.rpe))return a&&isN(a.load)?a.load:null;if(a.tech==='poor')return rnd(a.load*.9);const rir=Math.max(0,Math.round(10-a.rpe)),e=a.load*(1+(a.reps+rir)/30)/(1+(K.TARGET_REPS+K.TARGET_RIR)/30);
 if(a.reps<K.REP_MIN)return Math.min(rnd(e),Math.max(K.STEP,a.load-K.STEP));
 return(a.reps>K.REP_MAX||a.rpe<K.RPE_MIN)?Math.min(Math.max(rnd(e),a.load+K.STEP),Math.max(rnd(a.load*K.MAX_UP),a.load+K.STEP)):Math.min(rnd(e),Math.max(K.STEP,a.load-K.STEP))},
tm:(e,c,d)=>isN(e)&&e>0&&K.TM[c]?rnd(e*K.TM[c]*(d?K.DETRAIN:1)):null,
warm:l=>!(isN(l)&&l>0)?[]:K.WARM.map(([f,r])=>[rnd(l*f),r]),
cardio(c){if(!c||!isN(c.rpe)||c.rpe<1||c.rpe>10)return{min:null,t:'Invalid cardio data'};return c.stopped?{min:20,t:'Stopped early: start at ~20 min or shorter intervals; repeat the test later'}:c.rpe<=6?{min:30,t:'Completed at manageable effort: start ~30 min easy, 2-3x/week'}:{min:20,t:'Completed but hard: start ~20 min easy, 2-3x/week'}},
run(r){if(!r||typeof r!=='object')return{s:'R0',t:'Invalid running screen data'};if(r.worse||r.pain>=K.PAIN_SEVERE||r.walk!=='yes')return{s:'R0',t:'No running yet: build walking tolerance first'};

// ---------- in-app simulation (synthetic profiles only): writes dated history ending today ----------
const SIMM={ross:{gain:.008,adh:.85,sleep:6.6,ready:6,bw:-.35,fat:[[56,66]],symRun:[[98,112]],ill:[],gap:[],warn:[]},lindsey:{gain:.006,adh:.80,sleep:6,ready:5.5,bw:-.1,fat:[],symRun:[],ill:[[84,89]],gap:[[126,155]],warn:[[105,105]]},beginner:{gain:.012,adh:.65,sleep:7,ready:6,bw:-.2,fat:[],symRun:[],ill:[],gap:[],warn:[],knee:[[70,70]]}};
function simRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const simIn=(rs,d)=>(rs||[]).some(([a,b])=>d>=a&&d<=b),simClamp=(x,a,b)=>Math.max(a,Math.min(b,x));
Synth.simulate=function(days,seed){days=Math.max(7,Math.min(366,days|0||183));seed=seed||2026;if(!synthProfiles().length)Synth.create();
 Batch.begin();try{const end=ymd(Date.now()),start=addD(end,-days);CLOCK.t=pdt(start);Synth.reset();
  const P={};synthProfiles().forEach((p,i)=>{const k=p.synthetic_key,b=baseline(p.id),truth={};for(const ex in b.e1)truth[ex]=b.e1[ex].e1||b.e1[ex].tm;P[k]={id:p.id,m:SIMM[k],r:simRng(seed+i*101),truth,paused:0}});
  const keys=Object.keys(P);
  for(let di=0;di<days;di++){const d=addD(start,di);CLOCK.t=pdt(d);
   for(const k of keys){const o=P[k],id=o.id,m=o.m,r=o.r,sp=SYN[k],fat=simIn(m.fat,di),ill=simIn(m.ill,di),gap=simIn(m.gap,di),symRun=simIn(m.symRun,di);
    const sleep=fat?4.5+r():simClamp(m.sleep+(r()-.5)*1.4,4,9),ready=fat?2+Math.floor(r()*2):simClamp(Math.round(m.ready+(r()-.5)*3),3,9),sore=fat?8:simClamp(Math.round(2+r()*3),1,6);
    if(r()<.92)Chk.log(id,{sleep,readiness:ready,soreness:sore,illness:ill,pain:symRun,pain_level:symRun?4:0});
    if(di%7===0)Chk.body(id,{kg:+(sp.bw+m.bw*di/7+(r()-.5)*.8).toFixed(1),waist:+(sp.ws+m.bw*di/7*.6).toFixed(1)});
    Coach.day(id,true);
    coachOf(id).limitations.filter(l=>l.status==='active'&&l.review_due&&l.type!=='all').forEach(l=>Coach.resolve(id,l.id));
    if(coachOf(id).paused_safety){o.paused++;if(o.paused>=3){Coach.ack(id);o.paused=0}continue}
    for(const ex in o.truth)o.truth[ex]*=1+m.gain/7*Math.max(.25,1-di/260);
    const w=Wk.today(id);if(!w||w.status!=='scheduled')continue;
    const forced=(k==='lindsey'&&simIn(m.warn,di))||(k==='beginner'&&simIn(m.knee,di));if(!forced&&(gap||(ill&&r()<.8)||r()>m.adh))continue;
    if(!Wk.start(id,w.id).ok)continue;const fF=fat?.88:ill?.9:1;
    if(w.type==='resistance'){let g=0;while(g++<60){const sg=Wk.suggest(id,w.id);if(sg.done)break;
      const load=sg.load!=null?sg.load:Math.max(2,Math.round((o.truth[sg.ex]||40)/(1+(sg.rmin+2+3)/30))),tE=(o.truth[sg.ex]||40)*fF*(1+(r()-.5)*.03),possible=Math.max(0,Math.floor(30*(tE/load-1))),rir=2+Math.floor(r()*2);
      let reps=Math.min(sg.rmax,Math.max(0,possible-rir)),rf=false;if(possible<1){reps=0;rf=true}else if(reps<1)reps=1;
      const rpe=simClamp(Math.round((10-(possible-reps)+(r()-.5)*.8)*2)/2,5,10);let tech='ACCEPTABLE';if(rpe>=9&&r()<.04)tech='MINOR_DETERIORATION';
      let warning=false,pain=0,worsening=false;if(k==='lindsey'&&simIn(m.warn,di)&&sg.idx===1&&sg.set===1)warning=true;if(k==='beginner'&&simIn(m.knee,di)&&/squat/.test(sg.ex)&&sg.set===2){pain=5;worsening=true}
      const out=Wk.logSet(id,w.id,{load,reps,rpe,tech,pain,worsening,warning,rep_failure:rf});if(!out.ok||out.stopped)break}
     Wk.finish(id,w.id)}
    else{const w2=repo.get('workouts',w.id,id);Wk.logSess(id,w.id,{minutes:w2.plan[0].minutes,rpe:fat?7:5,pain:symRun&&(w.type==='running'||w.type==='sport')?3:0,completed:true,gait:false})}
    const due=repo.list('reassess',id).find(x=>x.status==='due');
    if(due&&(o.reass==null||di-o.reass>14)){const s2=JSON.parse(JSON.stringify(sp));for(const ex in s2.strength){const t=o.truth[ex];if(t)s2.strength[ex]=[Math.max(2,Math.round(t/(1+5/30)/2.5)*2.5),5,8,'familiar']}CLOCK.t=pdt(d)+36e5;Synth.reassess(id,s2);CLOCK.t=pdt(d);o.reass=di}}}
  CLOCK.t=null;const ross=P.ross?P.ross.id:null;for(const k of keys)Coach.day(P[k].id,true);
  if(P.ross&&(!P_active_locked()))db.active=P.ross.id;save();
  const c=k=>{const id=P[k].id;return repo.list('workouts',id).filter(w=>w.status==='completed'||w.status==='modified').length};
  return{ok:true,days,summary:keys.map(k=>SYN[k].name.split(' ')[0]+' '+c(k)+' sessions').join(', ')}}
 finally{CLOCK.t=null;Batch.end()}};
const P_active_locked=()=>{const p=P();return !!(p&&inWorkout(p.id)&&!p.synthetic)};
A.simAsk=d=>ask('Generate '+Math.round(d/30)+' month(s) of synthetic training for the three TEST profiles, ending today? Their existing test history is replaced. Real profiles are not touched.',()=>{$('ovl').innerHTML='<div class="scrim"></div><div id="ov"><div class="big">Simulating…</div><p class="mut">This can take several seconds. Please wait.</p></div>';setTimeout(()=>{try{const r=Synth.simulate(d);clearMsg();V={s:'prgs'};render();note('Simulation done: '+r.summary+'. All data is SYNTHETIC. Switch between the test profiles from the name at the top.')}catch(e){CLOCK.t=null;clearMsg();note('Simulation failed: '+e.message)}},80)});


// ---------- phone-storage safety: ask the browser to keep data, remind about backups ----------
try{if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const backupDue=pid=>{const p=prof(pid);if(!p||p.synthetic)return false;if(!lastFinal(pid)&&!repo.list('workouts',pid).length)return false;return !db.lastBackup||diffD(today(),db.lastBackup.slice(0,10))>=14};
A.backupNow=()=>{V.txt=JSON.stringify(db);V.s='bk';render()};

const psig=p=>JSON.stringify([p.equipment_ids,p.training_days_per_week,p.primary_goals,!!(p.sport_return&&p.sport_return.enabled),p.exercise_exclusions]);
function onProfileChanged(pid){if(lastFinal(pid)){createProgramme(pid,'profile change');cu(pid,c=>{c.profile_change='training availability, equipment, goals or sport pathway changed'});Coach.day(pid,true)}}

mig();render();
</script></body></html>
